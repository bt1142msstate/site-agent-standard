<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Site Agent Standard example</title>
    <link rel="alternate" type="application/json" href="./site-agent.json" data-site-agent-manifest>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; color: #102a43; background: #f4f8fb; }
      header { position: sticky; top: 0; z-index: 4; padding: 18px 24px; background: white; border-bottom: 1px solid #d9e2ec; }
      main { max-width: 900px; margin: auto; padding: 40px 20px 90vh; }
      .demo-scroll { height: 340px; overflow: auto; border: 1px solid #bcccdc; background: white; }
      .demo-canvas { width: 1100px; height: 900px; padding: 720px 0 0 840px; }
      .target { width: 190px; min-height: 64px; }
      .is-navigation-focus { outline: 4px solid #1684b3; outline-offset: 4px; }
      button { min-height: 44px; padding: 10px 16px; font: inherit; }
    </style>
  </head>
  <body>
    <header><strong>Site Agent Standard</strong></header>
    <main>
      <h1>Verified exact-target navigation</h1>
      <p>The target is inside collapsed content and a two-axis scroll surface.</p>
      <button id="show-target" type="button">Show target</button>
      <details>
        <summary>Advanced content</summary>
        <div class="demo-scroll"><div class="demo-canvas"><button class="target">Exact target</button></div></div>
      </details>
    </main>
    <script type="module">
      import { focusVerifiedNavigationTarget } from "../../src/site-navigator.js";
      document.querySelector("#show-target").addEventListener("click", () => {
        focusVerifiedNavigationTarget({ target: document.querySelector(".target") });
      });
    </script>
  </body>
</html>
